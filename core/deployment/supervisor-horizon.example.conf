; Supervisor — keep Laravel Horizon running (copy to /etc/supervisor/conf.d/horizon.conf)
; sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start horizon

[program:horizon]
process_name=%(program_name)s
command=php /var/www/staylbd/core/artisan horizon
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/staylbd/core/storage/logs/horizon.log
stopwaitsecs=3600
