# Example: Nginx + PHP-FPM for Laravel (adjust paths, socket, and server_name).
# High concurrency: raise pm.max_children based on RAM (each worker ~50–128MB).
#
# PHP-FPM pool (e.g. /etc/php/8.2/fpm/pool.d/laravel.conf):
#   pm = dynamic
#   pm.max_children = 50
#   pm.start_servers = 10
#   pm.min_spare_servers = 5
#   pm.max_spare_servers = 20
#   pm.max_requests = 500
#   request_terminate_timeout = 90s

server {
    listen 443 ssl http2;
    server_name yourdomain.com;
    root /var/www/staylbd/core/public;
    index index.php;

    # Brotli: use ngx_brotli module or terminate TLS at Cloudflare (recommended).
    # gzip on; gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 90;
    }

    location ~* \.(css|js|woff2?|ttf|eot|ico|jpg|jpeg|png|gif|webp|svg)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
