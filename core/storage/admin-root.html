<script>
    "use strict";
    function notify(status, message) {
        var opts = {
            message: typeof message == 'string' ? message : (message && message[0]) ? message[0] : '',
            position: 'topRight',
            timeout: 1200,
            transitionIn: 'fadeInDown',
            transitionOut: 'fadeOutUp',
            displayMode: 'replace',
            closeOnClick: true
        };
        if (typeof message == 'string') {
            iziToast[status](opts);
        } else if (message && message.length) {
            message.forEach(function(val) {
                iziToast[status]({ message: val, position: opts.position, timeout: opts.timeout, transitionIn: opts.transitionIn, transitionOut: opts.transitionOut, displayMode: opts.displayMode, closeOnClick: opts.closeOnClick });
            });
        }
    }
</script>

    <script>
(function() {
    'use strict';
    document.addEventListener('DOMContentLoaded', function() {
        var form = document.getElementById('formAuthentication');
        var policyCheck = document.getElementById('policyConfirm');
        var loginBtn = document.getElementById('adminLoginBtn');
        
        if (form && policyCheck) {
            form.addEventListener('submit', function(e) {
                if (!policyCheck.checked) {
                    e.preventDefault();
                    policyCheck.classList.add('is-invalid');
                    policyCheck.focus();
                    return false;
                }
                
                if (loginBtn) {
                    loginBtn.disabled = true;
                    loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Logging in...';
                }
            });
            
            policyCheck.addEventListener('change', function() {
                if (this.checked) {
                    this.classList.remove('is-invalid');
                }
            });
        }

        // Captcha Refresh Logic
        var refreshBtn = document.getElementById('adminCaptchaRefresh');
        var captchaImg = document.getElementById('adminCaptchaImage');
        var captchaCodeText = document.getElementById('adminCaptchaCode');
        
        if (refreshBtn) {
            refreshBtn.addEventListener('click', function() {
                if (captchaImg) {
                    captchaImg.src = 'http://localhost/staylbd/sajaladminopu/captcha-image?t=' + Date.now();
                } else if (captchaCodeText) {
                    fetch('http://localhost/staylbd/sajaladminopu/captcha-refresh', { 
                        headers: { 'X-Requested-With': 'XMLHttpRequest', 'Accept': 'application/json' } 
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.code) captchaCodeText.textContent = data.code;
                    });
                }
            });
        }
    });
})();
</script>
